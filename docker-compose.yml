services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Maceio
    volumes:
      - ouvidoria_db:/var/lib/mysql
      - ./private/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL}
      FORCE_SSL: ${FORCE_SSL:-0}
      HESK_DEBUG: ${HESK_DEBUG:-0}
      HESK_URL_KEY: ${HESK_URL_KEY}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OUVIDORIA_API_TOKEN: ${OUVIDORIA_API_TOKEN:-}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./private/anexos:/var/www/html/anexos

volumes:
  ouvidoria_db:
